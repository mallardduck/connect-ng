---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: productregistrations.rancher.registration.suse.com
spec:
  group: rancher.registration.suse.com
  names:
    kind: ProductRegistration
    listKind: ProductRegistrationList
    plural: productregistrations
    shortNames:
    - rancherreg
    - rreg
    singular: productregistration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.activationStatus.activated
      name: Registration Active
      type: boolean
    - jsonPath: .status.sccSystemID
      name: System ID
      type: integer
    - jsonPath: .status.activationStatus.lastValidatedTS
      name: Last Sync
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProductRegistrationSpec defines the desired state of ProductRegistration.
              This spec is common across all products using the registration library.
              Based on scc-operator's RegistrationSpec.
            properties:
              mode:
                default: online
                description: Mode determines the registration workflow (online or
                  offline).
                enum:
                - online
                - offline
                type: string
              offlineRegistrationCertificateSecretRef:
                description: |-
                  OfflineRegistrationCertificateSecretRef points to the Secret containing
                  the certificate uploaded by the user in offline mode.
                  Only relevant when Mode is "offline".
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              registrationRequest:
                description: RegistrationRequest contains references to secrets with
                  registration data.
                properties:
                  registrationAPICertificateSecretRef:
                    description: |-
                      RegistrationAPICertificateSecretRef points to a Secret containing a custom CA certificate.
                      Used when RegistrationAPIUrl points to a server with custom TLS certificate.
                      The secret should have a key "ca.crt" with the PEM-encoded certificate.
                    properties:
                      name:
                        description: name is unique within a namespace to reference
                          a secret resource.
                        type: string
                      namespace:
                        description: namespace defines the space within which the
                          secret name must be unique.
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  registrationAPIUrl:
                    description: |-
                      RegistrationAPIUrl is a custom SCC URL (e.g., for RMT proxy).
                      If nil, uses default SCC.
                    type: string
                  registrationCodeSecretRef:
                    description: |-
                      RegistrationCodeSecretRef points to the Secret containing the SCC registration code.
                      The secret should have a key "registrationCode" with the code value.
                      May be nil for BAYG/RMT scenarios or offline mode.
                    properties:
                      name:
                        description: name is unique within a namespace to reference
                          a secret resource.
                        type: string
                      namespace:
                        description: namespace defines the space within which the
                          secret name must be unique.
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              syncNow:
                description: |-
                  SyncNow triggers an immediate sync when set to true.
                  The controller will reset this to false after processing.
                type: boolean
            type: object
          status:
            description: |-
              ProductRegistrationStatus defines the observed state of ProductRegistration.
              This status is common across all products using the registration library.
              Based on scc-operator's RegistrationStatus.
            properties:
              activationStatus:
                description: ActivationStatus contains activation-related state.
                properties:
                  activated:
                    default: false
                    description: Activated indicates if the system is activated with
                      SCC.
                    type: boolean
                  lastValidatedTS:
                    description: LastValidatedTS is when the system was last validated
                      (keepalive).
                    format: date-time
                    type: string
                  systemURL:
                    description: |-
                      SystemURL is the SCC URL for this system (for UI links).
                      Example: https://scc.suse.com/systems/12345
                    type: string
                required:
                - activated
                type: object
              conditions:
                description: |-
                  Conditions represent the latest available observations of the registration state.
                  Standard conditions: Ready, Done, Progressing, Failure
                  Registration conditions: RegistrationAnnounced, RegistrationSccUrlReady, RegistrationActivated, RegistrationKeepalive
                  Offline conditions: OfflineRequestReady, OfflineCertificateReady, OfflineActivationDone
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              offlineRegistrationRequest:
                description: |-
                  OfflineRegistrationRequest points to the Secret containing the offline registration request XML.
                  Only populated in offline mode.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              registeredProduct:
                description: RegisteredProduct is the product name from SCC.
                type: string
              registrationExpiresAt:
                description: RegistrationExpiresAt is when the registration expires.
                format: date-time
                type: string
              registrationProcessedTS:
                description: RegistrationProcessedTS is when the registration was
                  last processed.
                format: date-time
                type: string
              sccSystemID:
                description: |-
                  SCCSystemID is the ID assigned by SCC after registration.
                  Nil if not yet registered. -1 for offline mode.
                type: integer
              subscriptionInfo:
                description: |-
                  SubscriptionInfo contains metadata about the subscription from SCC.
                  Populated by querying /connect/subscriptions/info during registration.
                  Updated when syncNow is triggered.
                properties:
                  expiresAt:
                    description: ExpiresAt is when the subscription expires
                    format: date-time
                    type: string
                  kind:
                    description: Kind is the subscription type (e.g., "full", "trial")
                    type: string
                  name:
                    description: Name is the subscription name
                    type: string
                  productClasses:
                    description: ProductClasses lists the product classes covered
                      by this subscription
                    items:
                      description: ProductClassInfo describes a product class available
                        under the subscription.
                      properties:
                        description:
                          description: Description is a human-readable description
                          type: string
                        name:
                          description: Name is the product class identifier (e.g.,
                            "RANCHER-X86", "SLES-X86")
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  startsAt:
                    description: StartsAt is when the subscription becomes active
                    format: date-time
                    type: string
                required:
                - kind
                - name
                type: object
              systemCredentialsSecretRef:
                description: |-
                  SystemCredentialsSecretRef points to the Secret containing SCC system credentials.
                  Created by the controller after successful registration.
                  Contains login/password for SCC API access.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
