# Entrypoint Secret - Contains user-provided registration configuration
# This is the only resource users need to create manually
apiVersion: v1
kind: Secret
metadata:
  name: rancher-scc-entrypoint
  namespace: cattle-system
type: Opaque
stringData:
  # Required: SCC registration code
  registrationCode: "ENTER-YOUR-SCC-REGISTRATION-CODE-HERE"

  # Optional: Registration mode (defaults to "online")
  mode: "online"  # or "offline" for air-gapped environments

  # Optional: Custom SCC URL (defaults to https://scc.suse.com)
  # registrationURL: "https://scc.suse.com"
