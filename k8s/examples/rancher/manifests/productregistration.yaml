# ProductRegistration - Cluster-scoped resource that triggers registration
apiVersion: rancher.registration.suse.com/v1
kind: ProductRegistration
metadata:
  name: rancher-registration
spec:
  # Reference to the entrypoint secret containing registration configuration
  entrypointRef:
    name: rancher-scc-entrypoint
    namespace: cattle-system

---
# Example: Checking registration status
# kubectl get productregistrations.rancher.registration.suse.com rancher-registration
#
# NAME                   ACTIVATED   SYSTEM ID   LAST SYNC
# rancher-registration   true        12345       2026-06-16T10:30:00Z

# Example: Viewing detailed status
# kubectl get productregistrations.rancher.registration.suse.com rancher-registration -o yaml
#
# status:
#   activated: true
#   sccSystemID: 12345
#   registeredProduct: Rancher
#   systemURL: https://scc.suse.com/systems/12345
#   lastSync: "2026-06-16T10:30:00Z"
#   nextSync: "2026-06-17T06:30:00Z"
#   expiresAt: "2027-06-16T10:30:00Z"
#   conditions:
#   - type: RegistrationAnnounced
#     status: "True"
#     lastTransitionTime: "2026-06-16T10:25:00Z"
#     message: "System registered with SCC"
#   - type: RegistrationActivated
#     status: "True"
#     lastTransitionTime: "2026-06-16T10:30:00Z"
#     message: "Products activated successfully"
#   - type: RegistrationKeepalive
#     status: "True"
#     lastTransitionTime: "2026-06-16T10:30:00Z"
#     message: "Keepalive successful"
